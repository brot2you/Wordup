<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WORDUP ARCADE V4 · Original Game Room</title>
<meta name="theme-color" content="#3D5AFE">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🃏</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Lexend:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#24194D; --ink-soft:#5B4F86; --bg:#EEE8FF; --dot:#DCD2FF; --card:#FFFFFF;
  --blue:#3D5AFE; --blue-d:#2A3FC7; --yellow:#FFC83D; --pink:#FF4F8B; --mint:#14C79A; --red:#F0434B;
  --bronze:#C9773A; --silver:#8FA2C2; --gold:#E9AE00;
  --r-lg:22px; --r-md:16px; --r-sm:12px;
  --display:"Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  --body:"Lexend", "Segoe UI", system-ui, sans-serif;
}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0}
body{font-family:var(--body);color:var(--ink);background-color:var(--bg);
  background-image:radial-gradient(var(--dot) 1.6px, transparent 1.7px);background-size:22px 22px;
  font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent;min-height:100vh}
body.big{font-size:18.5px}
button{font-family:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--pink);outline-offset:3px}
h1,h2,h3{font-family:var(--display);line-height:1.1;margin:0}
.app{max-width:540px;margin:0 auto;padding:14px 14px 110px;min-height:100vh}
.hidden{display:none!important}
.stk{background:var(--card);border:3px solid var(--ink);border-radius:var(--r-lg);box-shadow:0 5px 0 var(--ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:3px solid var(--ink);border-radius:var(--r-md);
  background:var(--card);box-shadow:0 4px 0 var(--ink);padding:12px 16px;font-family:var(--display);font-weight:700;font-size:1.08em;
  transition:transform .06s, box-shadow .06s;text-decoration:none}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn.blue{background:var(--blue);color:#fff}
.btn.yellow{background:var(--yellow)}
.btn.pink{background:var(--pink);color:#fff}
.btn.mint{background:var(--mint);color:#fff}
.btn.wide{width:100%}
.btn.small{padding:7px 12px;font-size:.95em;border-radius:var(--r-sm);box-shadow:0 3px 0 var(--ink)}
.muted{color:var(--ink-soft)}
.row{display:flex;gap:10px;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sec{margin-top:22px}
.sec>h2{font-size:1.45em;margin:0 0 10px 4px}

/* Top bar */
.topbar{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.avatar{width:52px;height:52px;border-radius:50%;border:3px solid var(--ink);background:var(--yellow);display:grid;place-items:center;font-size:28px;box-shadow:0 3px 0 var(--ink);flex:none}
.who{flex:1;min-width:0}
.who b{font-family:var(--display);font-size:1.25em;display:block;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who small{color:var(--ink-soft)}
.chip{display:inline-flex;align-items:center;gap:5px;border:3px solid var(--ink);border-radius:999px;padding:3px 10px;background:#fff;font-family:var(--display);font-weight:800;font-size:1.05em;box-shadow:0 3px 0 var(--ink)}
.chip.fire{background:#FFE1EC}
.chip.coin{background:#FFF1C7}

/* Hero: daily goal */
.hero{padding:16px;display:flex;gap:16px;align-items:center;background:var(--blue);color:#fff;position:relative;overflow:hidden}
.hero h1{font-size:1.65em}
.hero p{margin:4px 0 0;opacity:.92;font-size:.95em}
.ring{width:84px;height:84px;flex:none;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring span{position:absolute;inset:0;display:grid;place-items:center;font-size:34px}
.lvbar{height:12px;border:3px solid var(--ink);border-radius:99px;background:#fff;overflow:hidden;margin-top:6px}
.lvbar i{display:block;height:100%;background:var(--yellow)}

/* Actions */
.actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.action{padding:14px;text-align:left;display:flex;flex-direction:column;gap:4px;min-height:108px;border:3px solid var(--ink);border-radius:var(--r-lg);box-shadow:0 5px 0 var(--ink);background:#fff}
.action:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
.action .ic{font-size:34px;line-height:1}
.action b{font-family:var(--display);font-size:1.18em;line-height:1.05}
.action small{color:var(--ink-soft);font-size:.82em}
.action.primary{grid-column:1 / -1;background:var(--yellow);flex-direction:row;align-items:center;min-height:0}
.action.primary .ic{font-size:44px}
.badge-n{display:inline-block;background:var(--pink);color:#fff;border:2px solid var(--ink);border-radius:99px;padding:0 8px;font-family:var(--display);font-weight:800;margin-left:auto;font-size:1.1em}
.glow{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 5px 0 var(--ink),0 0 0 6px rgba(255,79,139,.35)}}

/* Quests */
.quest{display:flex;align-items:center;gap:12px;padding:10px 12px;border-bottom:2px dashed #D8D0F4}
.quest:last-child{border-bottom:0}
.quest .qi{font-size:26px}
.quest .qb{flex:1}
.quest .qb div{font-size:.92em;font-weight:500}
.pbar{height:9px;background:#EAE4FF;border-radius:99px;overflow:hidden;margin-top:5px;border:2px solid var(--ink)}
.pbar i{display:block;height:100%;background:var(--mint)}

/* Theme map */
.map{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.isle{padding:12px;text-align:left;display:flex;gap:10px;align-items:center;border:3px solid var(--ink);border-radius:var(--r-lg);background:#fff;box-shadow:0 4px 0 var(--ink);position:relative}
.isle:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.isle .ti{font-size:30px;flex:none}
.isle b{font-family:var(--display);font-size:1.02em;line-height:1.05;display:block}
.isle small{font-size:.76em;color:var(--ink-soft)}
.isle .crown{position:absolute;top:-12px;right:-6px;font-size:24px;transform:rotate(14deg)}
.mini{height:7px;border-radius:99px;background:#EAE4FF;overflow:hidden;margin-top:4px}
.mini i{display:block;height:100%;background:var(--blue)}

/* Tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));background:rgba(238,232,255,.94);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-top:3px solid var(--ink)}
.tabbar .in{display:flex;gap:6px;max-width:540px;width:100%}
.tab{flex:1;border:0;background:none;padding:6px 0;border-radius:14px;font-family:var(--display);font-weight:700;font-size:.9em;display:flex;flex-direction:column;align-items:center;gap:0}
.tab span{font-size:24px;line-height:1.1}
.tab.on{background:#fff;border:3px solid var(--ink);box-shadow:0 3px 0 var(--ink)}

/* Game header */
.ghead{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.x{width:44px;height:44px;border-radius:50%;border:3px solid var(--ink);background:#fff;font-size:20px;font-weight:800;box-shadow:0 3px 0 var(--ink);flex:none}
.prog{flex:1;height:18px;border:3px solid var(--ink);border-radius:99px;background:#fff;overflow:hidden}
.prog i{display:block;height:100%;background:var(--mint);transition:width .3s}
.hearts{font-size:20px;letter-spacing:1px;flex:none}

/* Question */
.qcard{padding:18px;text-align:center}
.qtitle{font-family:var(--display);font-size:1.25em;margin-bottom:12px}
.bigem{font-size:76px;line-height:1.1}
.speak{width:96px;height:96px;border-radius:50%;font-size:44px;background:var(--blue);color:#fff;border:3px solid var(--ink);box-shadow:0 5px 0 var(--ink)}
.speak:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
.slow{width:52px;height:52px;border-radius:50%;font-size:24px;background:#fff;border:3px solid var(--ink);box-shadow:0 3px 0 var(--ink);vertical-align:bottom;margin-left:8px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.opt{padding:12px 8px;min-height:74px;border:3px solid var(--ink);border-radius:var(--r-md);background:#fff;box-shadow:0 4px 0 var(--ink);font-family:var(--display);font-weight:700;font-size:1.12em;line-height:1.1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.opt:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.opt .oe{font-size:34px;line-height:1}
.opt small{font-family:var(--body);font-weight:500;font-size:.72em;color:var(--ink-soft)}
.opt.good{background:#D2F7EA;border-color:#0C8D6B}
.opt.bad{background:#FFDDE0;border-color:var(--red)}
.opt.one{grid-column:1 / -1}
.sentence{font-size:1.25em;font-weight:500;line-height:1.5;margin:6px 0}
.blank{display:inline-block;min-width:90px;border-bottom:4px solid var(--blue);margin:0 3px}
mark.weak{background:#FFDDE0;border:2px solid var(--red);border-radius:8px;padding:0 5px;color:var(--ink)}
mark.strong{background:#D2F7EA;border:2px solid #0C8D6B;border-radius:8px;padding:0 5px;color:var(--ink)}
mark.hl{background:var(--yellow);border-radius:6px;padding:0 4px;color:var(--ink)}
.tip{background:#FFF6D9;border:2px dashed var(--ink);border-radius:var(--r-sm);padding:8px 10px;font-size:.92em;margin-top:10px;text-align:left}

/* Spell */
.slots{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin:16px 0 6px}
.slot{width:40px;height:48px;border:3px solid var(--ink);border-radius:10px;background:#F6F3FF;font-family:var(--display);font-weight:800;font-size:1.5em;display:grid;place-items:center;padding:0}
.slot.fixed{border-color:transparent;background:none;width:18px}
.slot.full{background:#fff}
.tiles{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:12px}
.tile{width:46px;height:50px;border:3px solid var(--ink);border-radius:12px;background:var(--yellow);box-shadow:0 4px 0 var(--ink);font-family:var(--display);font-weight:800;font-size:1.5em;padding:0}
.tile.used{visibility:hidden}

/* Feedback */
.fb{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));border-top:3px solid var(--ink);animation:up .18s ease-out}
.fb .in{max-width:540px;margin:0 auto}
.fb.ok{background:#D2F7EA}
.fb.ko{background:#FFDDE0}
.fb h3{font-size:1.5em}
.fb p{margin:4px 0 12px}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}

/* Cards (collection) */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.wc{position:relative;aspect-ratio:3/4;border:3px solid var(--ink);border-radius:14px;background:#fff;box-shadow:0 3px 0 var(--ink);padding:6px 4px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;overflow:hidden}
.wc .we{font-size:34px;line-height:1.1}
.wc b{font-family:var(--display);font-size:.92em;line-height:1.05;margin-top:4px;word-break:break-word}
.wc.locked{background:repeating-linear-gradient(45deg,#E4DCFF 0 8px,#EEE8FF 8px 16px);color:var(--ink-soft)}
.wc.locked .we{opacity:.45;filter:grayscale(1)}
.wc .pip{position:absolute;top:4px;right:5px;font-size:.7em}
.t-new{border-color:var(--ink)}
.t-bronze{background:linear-gradient(160deg,#FFF3E8,#F6D2B4);border-color:var(--bronze)}
.t-silver{background:linear-gradient(160deg,#FFFFFF,#D9E2F1);border-color:var(--silver)}
.t-gold{background:linear-gradient(160deg,#FFF9DC,#FFD95C);border-color:var(--gold)}
.t-gold::after{content:"";position:absolute;inset:-40%;background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.75) 50%,transparent 60%);animation:shine 3.2s linear infinite}
@keyframes shine{from{transform:translateX(-60%)}to{transform:translateX(60%)}}
.tabs{display:flex;gap:8px;margin-bottom:14px;overflow-x:auto;padding:2px 2px 6px}
.tabs .btn{flex:none}
.tabs .btn.on{background:var(--ink);color:#fff}
.thead{display:flex;align-items:center;gap:10px;margin:18px 0 10px}
.thead .ti{font-size:30px}
.thead b{font-family:var(--display);font-size:1.25em}

/* Big card */
.bigcard{max-width:330px;margin:0 auto;aspect-ratio:3/4.1;border:4px solid var(--ink);border-radius:26px;box-shadow:0 7px 0 var(--ink);background:#fff;padding:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;position:relative;overflow:hidden}
.bigcard .be{font-size:96px;line-height:1.05}
.bigcard h2{font-size:2.1em;margin-top:8px;word-break:break-word}
.bigcard .fr{font-size:1.05em;color:var(--ink-soft);margin-top:2px}
.bigcard .ex{margin-top:14px;font-size:1.02em;line-height:1.45}
.bigcard .tag{position:absolute;top:12px;left:12px;font-family:var(--display);font-weight:800;font-size:.85em;border:2px solid var(--ink);border-radius:99px;padding:0 9px;background:#fff}
.bigcard .lv{position:absolute;top:12px;right:12px;font-family:var(--display);font-weight:800;font-size:.85em}
.stars{margin-top:12px;font-size:1.1em;letter-spacing:2px}

/* Pack */
.pack{display:flex;justify-content:center;gap:10px;margin:22px 0;flex-wrap:wrap}
.pcard{display:block;width:30%;min-width:96px;max-width:150px;aspect-ratio:3/4;perspective:800px;border:0;background:none;padding:0}
.pcard .inner{display:block;position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.pcard.open .inner{transform:rotateY(180deg)}
.pcard .face{position:absolute;inset:0;border:3px solid var(--ink);border-radius:16px;box-shadow:0 4px 0 var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px;text-align:center}
.pcard .back{background:var(--blue);color:#fff;font-family:var(--display);font-size:2.4em;font-weight:800;background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.12) 0 10px,transparent 10px 20px)}
.pcard .front{background:#fff;transform:rotateY(180deg)}
.pcard .front .we{font-size:40px}
.pcard .front b{font-family:var(--display);font-size:1em;line-height:1.05;margin-top:4px}
.pcard .front small{font-size:.72em;color:var(--ink-soft)}
.pcard .front.rare{background:linear-gradient(160deg,#FFF0F6,#FFC3D9)}

/* Memory */
.mem{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mc{aspect-ratio:1/1;border:3px solid var(--ink);border-radius:14px;box-shadow:0 4px 0 var(--ink);background:var(--blue);color:#fff;font-family:var(--display);font-weight:800;font-size:1.05em;padding:4px;line-height:1.05;display:flex;flex-direction:column;align-items:center;justify-content:center}
.mc .q{font-size:2em}
.mc.up{background:#fff;color:var(--ink)}
.mc.done{background:#D2F7EA;color:var(--ink);opacity:.8}
.mc .e{font-size:30px}
.mc small{font-family:var(--body);font-size:.68em;color:var(--ink-soft);font-weight:500}

/* Speed */
.timer{height:16px;border:3px solid var(--ink);border-radius:99px;background:#fff;overflow:hidden;flex:1}
.timer i{display:block;height:100%;background:var(--pink);transition:width .25s linear}
.swcard{padding:22px 16px;text-align:center;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.swcard h2{font-size:2.3em}
.swpic{margin-top:14px;padding:12px;border:3px dashed var(--ink);border-radius:var(--r-md);background:#F6F3FF}
.swpic .e{font-size:58px;line-height:1.1}
.score{font-family:var(--display);font-weight:800;font-size:1.4em}
.flash-ok{animation:fok .35s}
.flash-ko{animation:fko .35s}
@keyframes fok{40%{background:#D2F7EA}}
@keyframes fko{40%{background:#FFDDE0;transform:translateX(-6px)}70%{transform:translateX(6px)}}

/* Wordle */
.wgrid{display:grid;grid-template-rows:repeat(6,1fr);gap:6px;max-width:300px;margin:0 auto}
.wrow{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.wcell{aspect-ratio:1/1;border:3px solid var(--ink);border-radius:10px;background:#fff;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:1.7em;text-transform:uppercase}
.wcell.g{background:var(--mint);color:#fff}
.wcell.y{background:var(--yellow)}
.wcell.n{background:#B9B2D3;color:#fff}
.kb{margin-top:14px;display:flex;flex-direction:column;gap:6px;align-items:center}
.kb .kr{display:flex;gap:4px;justify-content:center;width:100%}
.key{flex:1;max-width:40px;height:50px;border:2px solid var(--ink);border-radius:8px;background:#fff;font-family:var(--display);font-weight:800;font-size:1.05em;padding:0;box-shadow:0 2px 0 var(--ink);text-transform:uppercase}
.key.wide{max-width:66px;flex:1.6;font-size:.82em}
.key.g{background:var(--mint);color:#fff}.key.y{background:var(--yellow)}.key.n{background:#B9B2D3;color:#fff}

/* Ladder & lists */
.ladder{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.rung{display:flex;align-items:center;gap:10px;padding:10px 12px;border:3px solid var(--ink);border-radius:var(--r-md);background:#fff;box-shadow:0 3px 0 var(--ink);font-family:var(--display);font-weight:700;font-size:1.1em;text-align:left}
.rung .n{width:30px;height:30px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:.85em;flex:none}
.rung small{font-family:var(--body);font-weight:500;color:var(--ink-soft);font-size:.78em;margin-left:auto}
.rung.picked{opacity:.35}
.heat{height:12px;border-radius:99px;background:linear-gradient(90deg,#BFD3FF,var(--yellow),var(--pink));border:2px solid var(--ink);margin:8px 0 2px}

/* Arcade */
.games{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.game{padding:14px 12px;text-align:left;border:3px solid var(--ink);border-radius:var(--r-lg);box-shadow:0 5px 0 var(--ink);display:flex;flex-direction:column;gap:4px;min-height:132px}
.game:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
.game .ic{font-size:36px;line-height:1}
.game b{font-family:var(--display);font-size:1.18em;line-height:1.05}
.game small{font-size:.8em;color:var(--ink-soft)}
.game.c1{background:#FFE1EC}.game.c2{background:#DDF6FF}.game.c3{background:#E5FBEF}.game.c4{background:#FFF1C7}.game.c5{background:#EDE6FF}.game.c6{background:#FFE6D6}
.game.wide{grid-column:1 / -1;min-height:0;flex-direction:row;align-items:center;gap:12px}

/* Profile */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{padding:10px;text-align:center}
.stat b{font-family:var(--display);font-size:1.6em;display:block;line-height:1}
.stat small{font-size:.75em;color:var(--ink-soft)}
.badges{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.bdg{aspect-ratio:1/1;border:3px solid var(--ink);border-radius:50%;background:#fff;display:grid;place-items:center;font-size:30px;box-shadow:0 3px 0 var(--ink);padding:0}
.bdg.off{filter:grayscale(1);opacity:.35}
.set{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border-bottom:2px dashed #D8D0F4}
.set:last-child{border-bottom:0}
.set label{font-weight:500}
select,input[type=text]{font:inherit;border:3px solid var(--ink);border-radius:12px;padding:8px 10px;background:#fff;color:var(--ink);max-width:100%}
input[type=range]{accent-color:var(--blue);width:140px}
.sw{width:56px;height:32px;border-radius:99px;border:3px solid var(--ink);background:#D8D0F4;position:relative;padding:0;flex:none}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:#fff;border:2px solid var(--ink);transition:left .15s}
.sw.on{background:var(--mint)}
.sw.on::after{left:26px}
.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.item{padding:12px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px}
.item .ie{font-size:34px}
.item b{font-family:var(--display)}

/* Onboarding */
.logo{font-family:var(--display);font-weight:800;font-size:3.6em;line-height:.9;text-align:center;color:#fff;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 6px 0 var(--ink);margin:18px 0 6px;transform:rotate(-4deg)}
.logo span{color:var(--yellow)}
.pickers{display:flex;flex-wrap:wrap;gap:8px}
.pick{border:3px solid var(--ink);border-radius:14px;background:#fff;box-shadow:0 3px 0 var(--ink);padding:8px 12px;font-family:var(--display);font-weight:700;font-size:1.05em}
.pick.on{background:var(--ink);color:#fff}
.pick.av{font-size:30px;padding:4px 10px}

/* Modal & toast */
.modal{position:fixed;inset:0;z-index:50;background:rgba(36,25,77,.55);display:flex;align-items:flex-end;justify-content:center;padding:14px}
.modal .box{max-width:520px;width:100%;max-height:88vh;overflow:auto;padding:18px;margin-bottom:env(safe-area-inset-bottom,0px);animation:up .2s ease-out}
@media (min-width:640px){.modal{align-items:center}}
.toasts{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:0;right:0;z-index:60;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
.toast{background:var(--ink);color:#fff;border-radius:14px;padding:10px 14px;font-weight:500;max-width:92%;box-shadow:0 4px 0 rgba(0,0,0,.25);animation:drop .25s ease-out}
@keyframes drop{from{transform:translateY(-20px);opacity:0}}
.boss{text-align:center}
.boss .bm{font-size:72px;line-height:1;display:inline-block}
.boss .bm.hit{animation:fko .4s}
.hp{height:16px;border:3px solid var(--ink);border-radius:99px;background:#fff;overflow:hidden;max-width:260px;margin:6px auto 0}
.hp i{display:block;height:100%;background:var(--red);transition:width .3s}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:70;overflow:hidden}
.confetti span{position:absolute;top:-40px;font-size:28px;animation:fall 1.8s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
.result{text-align:center;padding:22px 16px}
.result .big{font-size:80px;line-height:1}
.result h1{font-size:2.2em;margin-top:6px}
.rew{display:flex;justify-content:center;gap:10px;margin:14px 0}
.list-words{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:10px}
.list-words span{border:2px solid var(--ink);border-radius:99px;padding:2px 10px;background:#fff;font-size:.9em}
.list-words span.ko{background:#FFDDE0}
.list-words span.ok{background:#D2F7EA}
.note{font-size:.85em;color:var(--ink-soft);margin-top:8px}

/* Postcards & places */
.post{display:flex;flex-direction:column;text-align:left;border:3px solid var(--ink);border-radius:var(--r-lg);background:#fff;box-shadow:0 4px 0 var(--ink);padding:0;overflow:hidden}
.post:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.post .cap{padding:8px 10px 10px;display:block}
.post .mini{display:block}
.post .cap b{font-family:var(--display);font-size:1em;line-height:1.05;display:block}
.post .cap small{display:block;font-size:.74em;color:var(--ink-soft);line-height:1.25}
.post .cap .stg{margin-top:3px;color:var(--ink);font-weight:500}
.art{position:relative;display:block;width:100%;aspect-ratio:16/10;overflow:hidden;border-bottom:3px solid var(--ink);background:#ddd;transition:filter .6s}
.art.art-lg{border:3px solid var(--ink);border-radius:var(--r-md)}
.art img{width:100%;height:100%;object-fit:cover;display:block}
.art .sky{position:absolute;inset:0;display:block}
.art .sun{position:absolute;top:12%;right:12%;width:18%;aspect-ratio:1;border-radius:50%;background:rgba(255,255,255,.7)}
.art .ground{position:absolute;left:-10%;right:-10%;bottom:-38%;height:62%;border-radius:50%;background:rgba(36,25,77,.18)}
.art .lm{position:absolute;left:50%;bottom:14%;transform:translateX(-50%);font-size:3.2em;line-height:1;z-index:1}
.art.art-lg .lm{font-size:5.4em}
.art .flag{position:absolute;top:8%;left:8%;font-size:1.3em}
.art.art-lg .flag{font-size:2em}
.art .who{position:absolute;right:7%;bottom:8%;font-size:1.7em;opacity:.25;filter:grayscale(1);z-index:2;transition:all .4s}
.art.art-lg .who{font-size:2.6em}
.art .who.on{opacity:1;filter:none;animation:bob 2.4s ease-in-out infinite}
.art.st-alive .lm{animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translate(var(--bx,0),-6px)}}
.art.st-alive .lm{--bx:-50%}
.pstamp{position:absolute;top:8%;right:8%;z-index:3;border:3px double #C0263A;color:#C0263A;border-radius:50%;width:2.6em;height:2.6em;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:.9em;line-height:.95;text-align:center;transform:rotate(-14deg);background:rgba(255,255,255,.75)}
.art.art-lg .pstamp{width:4.6em;height:4.6em;font-size:1em}
.banner{padding:10px}
.bubble{display:flex;gap:10px;align-items:flex-start;margin-top:10px}
.bubble .bwho{font-size:34px;line-height:1}
.bubble>div{flex:1;background:#F6F3FF;border:2px solid var(--ink);border-radius:14px 14px 14px 4px;padding:8px 10px;font-size:.9em}
.bubble p{margin:4px 0 0;font-size:1.08em;font-weight:500}
.mini-say{border:2px solid var(--ink);border-radius:99px;background:#fff;padding:0 6px;font-size:.85em;vertical-align:middle}
/* Mission */
.ticket{display:flex;align-items:center;gap:12px;padding:10px 14px;background:#FFF6D9;position:relative}
.ticket small{display:block;color:var(--ink-soft);font-size:.78em}
.ticket b{font-family:var(--display);font-size:1.3em;line-height:1.05}
.ticket .tk-l{font-size:30px}
.ticket .tk-r{margin-left:auto;font-size:30px;border-left:3px dashed var(--ink);padding-left:12px}
.chat{display:flex;flex-direction:column;gap:10px}
.chatline{display:flex;gap:8px;align-items:flex-end}
.chatline .av{font-size:28px;line-height:1;flex:none}
.chatline .b{max-width:78%;padding:10px 12px;border:3px solid var(--ink);border-radius:16px;font-size:1.05em;line-height:1.4;background:#fff;box-shadow:0 3px 0 var(--ink)}
.chatline.c .b{border-bottom-left-radius:4px}
.chatline.y{justify-content:flex-end}
.chatline.y .b{background:#DDE4FF;border-bottom-right-radius:4px}
/* Passport */
.passport{margin-top:14px;background:#1F2A6B;border:3px solid var(--ink);border-radius:var(--r-lg);box-shadow:0 5px 0 var(--ink);padding:12px;color:#fff}
.pp-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.pp-head span{font-size:30px}
.pp-head b{font-family:var(--display);font-size:1.25em;display:block;line-height:1}
.pp-head small{color:#C9D2FF}
.stamps{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:8px;background:#F4F1FF;border-radius:12px;padding:10px}
.stamp{aspect-ratio:1/1;border:3px dashed #B9B2D3;border-radius:50%;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px;color:#9A93B8;transform:rotate(var(--rot))}
.stamp .se{font-size:24px;filter:grayscale(1);opacity:.4}
.stamp .sn{font-family:var(--display);font-weight:700;font-size:.62em;line-height:1;text-align:center;margin-top:2px}
.stamp.on{border:3px double #C0263A;color:#C0263A;background:rgba(192,38,58,.06)}
.stamp.on .se{filter:none;opacity:1}
/* ✓ ✗ on answers */
.opt{position:relative}
.opt.good::after,.opt.bad::after{position:absolute;top:4px;right:8px;font-family:var(--display);font-weight:800;font-size:1.1em}
.opt.good::after{content:"✓";color:#0C8D6B}
.opt.bad::after{content:"✗";color:var(--red)}

/* Battleship */
.bs-grid{display:grid;grid-template-columns:20px repeat(6,1fr);gap:4px;margin-top:8px}
.bs-grid.mine{max-width:250px;margin-left:auto;margin-right:auto;gap:3px}
.bs-l{display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:.85em;color:var(--ink-soft)}
.bs-c{aspect-ratio:1/1;border:2px solid var(--ink);border-radius:7px;background:#DDF6FF;display:grid;place-items:center;font-size:1.1em;padding:0;font-weight:800}
button.bs-c:not([disabled]):hover{background:#BFE9FF}
.bs-grid.mine .bs-c{font-size:.8em}
.bs-c.ship{background:#B9C6E0}
.bs-c.miss{background:#F1EEFA;color:var(--ink-soft)}
.bs-c.hit{background:#FFDDE0}
.bs-c.sunk{background:#FFB3BA}
.bs-log{margin-top:10px;font-size:.88em;background:var(--ink);color:#fff;border-radius:12px;padding:8px 12px}
/* Crossword */
.cw-clue{display:flex;align-items:center;gap:10px;padding:10px 12px;margin-bottom:12px}
.cw-cn{font-family:var(--display);font-weight:800;font-size:1.2em;background:var(--ink);color:#fff;border-radius:10px;padding:2px 8px}
.cw-grid{display:grid;gap:2px;margin:0 auto}
.cw-c{aspect-ratio:1/1;border:2px solid var(--ink);border-radius:5px;background:#fff;position:relative;font-family:var(--display);font-weight:800;text-transform:uppercase;padding:0;display:grid;place-items:center;line-height:1}
.cw-c .n{position:absolute;top:1px;left:2px;font-size:.45em;font-weight:700}
.cw-c.sel{background:#DDE4FF}
.cw-c.ok{background:#D2F7EA;color:#0C6B52}
.cw-c.cur{background:var(--yellow);color:var(--ink)}
.cw-x{aspect-ratio:1/1}
.cw-li{display:block;width:100%;text-align:left;border:0;background:none;padding:5px 2px;font-size:.85em;border-bottom:1px dashed #D8D0F4}
.cw-li.on{font-weight:600;background:#EEE8FF;border-radius:6px}
.cw-li.done{text-decoration:line-through;color:var(--ink-soft)}
/* Builder */
.pieces{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:16px}
.pc{border:3px solid var(--ink);border-radius:12px;padding:9px 14px;font-family:var(--display);font-weight:800;font-size:1.15em;box-shadow:0 3px 0 var(--ink);background:#fff}
.pc.pre{background:#DDE4FF}
.pc.suf{background:#FFE1EC}
.pc.used{visibility:hidden}
.pc.sm{display:inline-block;padding:1px 8px;font-size:.95em;box-shadow:none;border-width:2px}
.bslots{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:16px;min-height:56px}
.bslot{width:96px;height:50px;border:3px dashed var(--ink-soft);border-radius:12px}
.plus{font-family:var(--display);font-weight:800;font-size:1.6em}
.opt.picked{background:#DDE4FF}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:360px){.opts{grid-template-columns:1fr}.key{height:44px}}

      g.gain.exponentialRampToValueAtTime(0.0001, t0 + n[1] + 0.18);

/* ================== DISTRACTORS ================== */
function distract(w, n, key, src) {
  var base = src || w.th.words;
  var cand = shuffle(base).concat(shuffle(WORDS));
  var out = [], seen = {}; seen[w[key].toLowerCase()] = 1;
  for (var i = 0; i < cand.length && out.length < n; i++) {
    var c = cand[i]; var v = c[key].toLowerCase();
    if (!v || seen[v] || c.fr === w.fr || c.en === w.en) continue;
    seen[v] = 1; out.push(c);
  }
  return out;
}

  document.body.dataset.view=VIEW;
  stopTimers();
  APP.innerHTML = html;
  window.scrollTo(0, 0);
  document.body.className = S.set.big ? 'big' : '';
}
function nav(on) {
  var t = [['home', '🏝️', 'Accueil'], ['arcade', '🎮', 'Jouer'], ['collection', '🃏', 'Collection'], ['profile', '😎', 'Profil']];
  var h = '<nav class="tabbar" aria-label="Navigation"><div class="in">';
  t.forEach(function (x) { h += '<button class="tab' + (on === x[0] ? ' on' : '') + '" data-act="go" data-arg="' + x[0] + '"' + (on === x[0] ? ' aria-current="page"' : '') + '><span>' + x[1] + '</span>' + x[2] + '</button>'; });
  return h + '</div></nav>';
}
function topbar() {
  var L = levelOf(S.xp), cur = S.xp - need(L), span = need(L + 1) - need(L);
  return '<header class="topbar"><button class="avatar" data-act="go" data-arg="profile" aria-label="Profil">' + S.p.avatar + '</button>' +
    '<div class="who"><b>' + esc(S.p.name) + '</b><small>Niv. ' + L + ' · ' + rankName(L) + '</small><div class="lvbar" title="' + cur + ' / ' + span + ' XP"><i style="width:' + Math.round(cur / span * 100) + '%"></i></div></div>' +
    '<span class="chip fire" title="Série de jours">🔥 ' + S.streak.n + '</span><span class="chip coin" title="Pièces">🪙 ' + S.coins + '</span></header>';
}
function go(v, arg) {
  closeModal();
  if (!S.p) return renderOnboarding();
  ensureDaily();
  if (v === 'home') renderHome();
  else if (v === 'arcade') renderArcade();
  else if (v === 'collection') renderCollection(arg);
  else if (v === 'profile') renderProfile();
  else if (v === 'theme') renderTheme(arg);
  while (pendingMsgs.length) toast(pendingMsgs.shift());
}

}

function cardMini(w) {

function stars(w) { var r = S.words[w.id]; if (!r) return ''; var s = ''; for (var i = 1; i <= 5; i++) s += i <= r.b ? '★' : '☆'; return s; }

/* ================== QUESTION ENGINE ================== */
var SES = null;
function makeItems(words, n, allow) {

    var w = src[i % src.length];
    var types = allow.filter(function (t) { return t !== 'spell' || w.spell; });

  }

}
function startSession(o) {
  SES = { title: o.title, items: o.items, i: 0, ok: 0, mode: o.mode, back: o.back, theme: o.theme, hearts: o.mode === 'boss' ? 3 : 0, hp: o.mode === 'boss' ? o.items.length - 2 : o.items.length, xp: 0, done: false, res: [], spoken: -1 };
  COMBO = 0;
  renderQ();
}
function optsFor(item) {
  var w = item.w;
  if (item.opts) return item.opts;
  var key = item.t === 'cloze' ? 'star' : (item.t === 'meaning' ? 'en' : 'fr');
  var ds = distract(w, 3, key);
  item.opts = shuffle([w].concat(ds));
  return item.opts;
}
function renderQ() {
  var it = SES.items[SES.i], w = it.w;

  var h = '<div class="ghead"><button class="x" data-act="quit" aria-label="Quitter">✕</button><div class="prog"><i style="width:' + Math.round(SES.i / SES.items.length * 100) + '%"></i></div>' + (SES.mode === 'boss' ? '<span class="hearts" aria-label="' + SES.hearts + ' cœurs">' + heartStr() + '</span>' : (COMBO >= 3 ? '<span class="chip fire">🔥x' + COMBO + '</span>' : '')) + '</div>';
  if (SES.mode === 'boss') {
    var t = THBYID[SES.theme];

  }
  h += '<div class="qcard stk" style="margin-top:12px">';
  var opts;

    opts = optsFor(it);
    h += '<div class="qtitle">Écoute et choisis la bonne image</div><button class="speak" data-act="say" data-arg="' + esc(w.en) + '" aria-label="Réécouter">🔊</button><button class="slow" data-act="saySlow" data-arg="' + esc(w.en) + '" aria-label="Lentement">🐢</button>';
    h += '<div class="opts">';
    opts.forEach(function (o, i) { h += '<button class="opt" data-act="ans" data-arg="' + i + '"><span class="oe">' + o.em + '</span><small>' + esc(o.fr) + '</small></button>'; });
    h += '</div>';
  } else if (it.t === 'meaning') {
    opts = optsFor(it);
    h += '<div class="qtitle">Comment dit-on… ?</div><div class="bigem">' + w.em + '</div><div style="font-size:1.2em;font-weight:600">' + esc(w.fr) + '</div><div class="opts">';
    opts.forEach(function (o, i) { h += '<button class="opt" data-act="ans" data-arg="' + i + '">' + esc(o.en) + '</button>'; });
    h += '</div>';
  } else if (it.t === 'cloze') {
    opts = optsFor(it);
    h += '<div class="qtitle">Complète la phrase</div><div style="font-size:40px">' + w.em + '</div><p class="sentence">' + esc(w.ex).replace(/\*[^*]+\*/, '<span class="blank">&nbsp;</span>') + '</p><div class="opts">';
    opts.forEach(function (o, i) { h += '<button class="opt" data-act="ans" data-arg="' + i + '">' + esc(o.star) + '</button>'; });
    h += '</div>';
  } else if (it.t === 'spell') {

function heartStr() { var s = ''; for (var i = 0; i < 3; i++) s += i < SES.hearts ? '❤️' : '🤍'; return s; }
function answer(idx) {
  if (SES.answered) return;

  SES.answered = true;
  var btns = APP.querySelectorAll('.opt');

  }

}
function finish(ok, kind) {
  var it = SES.items[SES.i], w = it.w;

    if (SES.mode === 'boss') { SES.hp--; var bm = $('bm'); if (bm) { bm.className = 'bm hit'; } }
  } else if (SES.mode === 'boss') { SES.hearts--; }

function nextQ() {
  if (!SES) return;

/* spell */
function buildSpell(target) {
  var slots = [], letters = [];
  for (var i = 0; i < target.length; i++) {
    var ch = target.charAt(i);
    if (/[a-zA-Z]/.test(ch)) { slots.push({ ch: ch.toLowerCase(), fixed: false, tile: -1 }); letters.push(ch.toLowerCase()); }
    else slots.push({ ch: ch, fixed: true, tile: -1 });
  }
  var abc = 'abcdefghijklmnoprstuwy';
  if (letters.length <= 7) { letters.push(abc.charAt(Math.floor(Math.random() * abc.length))); letters.push(abc.charAt(Math.floor(Math.random() * abc.length))); }
  var tiles = shuffle(letters).map(function (c) { return { ch: c, used: false }; });
  return { target: target, slots: slots, tiles: tiles, done: false };
}
function spellHtml(sp) {
  var h = '<div class="slots">';
  sp.slots.forEach(function (s, i) {
    if (s.fixed) h += '<span class="slot fixed">' + (s.ch === ' ' ? '&nbsp;' : esc(s.ch)) + '</span>';
    else h += '<button class="slot' + (s.tile >= 0 ? ' full' : '') + '" data-act="slot" data-arg="' + i + '" aria-label="Case ' + (i + 1) + '">' + (s.tile >= 0 ? sp.tiles[s.tile].ch : '') + '</button>';
  });
  h += '</div><div class="tiles">';
  sp.tiles.forEach(function (t, i) { h += '<button class="tile' + (t.used ? ' used' : '') + '" data-act="tile" data-arg="' + i + '">' + t.ch + '</button>'; });
  return h + '</div><button class="btn small" style="margin-top:14px" data-act="spellClear">Effacer</button>';
}
function tapTile(i) {
  var it = SES.items[SES.i], sp = it.sp; if (SES.answered || sp.tiles[i].used) return;
  for (var j = 0; j < sp.slots.length; j++) {
    if (!sp.slots[j].fixed && sp.slots[j].tile < 0) { sp.slots[j].tile = i; sp.tiles[i].used = true; sfx('flip'); break; }
  }
  $('spellzone').innerHTML = spellHtml(sp);
  var full = sp.slots.every(function (s) { return s.fixed || s.tile >= 0; });
  if (full) {
    var built = sp.slots.map(function (s) { return s.fixed ? s.ch : sp.tiles[s.tile].ch; }).join('');
    SES.answered = true;
    finish(built.toLowerCase() === sp.target.toLowerCase(), 'spell');
  }
}
function tapSlot(j) {
  var sp = SES.items[SES.i].sp; if (SES.answered) return;

}

function endSession(win) {

  if (R.k === 'derive') h += '<div class="qtitle">Fabrique le mot anglais qui veut dire :</div><h2 style="font-size:1.6em">« ' + esc(R.d[3]) + ' »</h2><p class="note" style="margin:4px 0 0">Une racine + un préfixe ou un suffixe.</p>';
  else h += '<div class="qtitle">Assemble le mot composé :</div><div class="bigem">' + R.c[4] + '</div><h2 style="font-size:1.4em">« ' + esc(R.c[3]) + ' »</h2>';
  if (R.stage === 'spell') {
    var res = R.d[1], clean = R.d[2].replace(/-/g, ''), pre = R.d[2].charAt(R.d[2].length - 1) === '-', naive = pre ? clean + R.d[0] : R.d[0] + clean;
    if (!R.spo) R.spo = shuffle([res, naive]);
    h += '<div class="tip" style="text-align:center">Bonnes pièces ! Mais attention à l\'orthographe : comment s\'écrit le mot ?</div><div class="opts">';
    R.spo.forEach(function (o, i) { h += '<button class="opt" data-act="bldSpell" data-arg="' + i + '">' + esc(o) + '</button>'; });
    h += '</div></div>';
    show(h, 'builder'); return;
  }
  h += '<div class="bslots">';
  for (var s = 0; s < 2; s++) {
    var pi = R.sel[s];
    h += pi === undefined ? '<span class="bslot"></span>' : '<button class="pc ' + R.pieces[pi].k + '" data-act="bldUnpick" data-arg="' + s + '">' + esc(R.pieces[pi].t) + '</button>';
    if (s === 0) h += '<span class="plus">+</span>';
  }
  h += '</div><div class="pieces">';
  R.pieces.forEach(function (p, i) { h += pieceHtml(p, i, R.sel.indexOf(i) >= 0); });
  h += '</div><p class="note">Bleu = préfixe (un-, dis-…) · rose = suffixe (-ful, -ness…) · blanc = racine ou mot.</p></div>';
  show(h, 'builder');
}
function bldPick(i) {
  var R = BLD.rounds[BLD.i];
  if (R.stage !== 'build' || R.sel.indexOf(i) >= 0 || R.sel.length >= 2) return;
  R.sel.push(i); sfx('flip');
  if (R.sel.length === 2) {
    var got = R.sel.map(function (k) { return R.pieces[k].t; }), ok = got[0] === R.want[0] && got[1] === R.want[1];
    if (ok && R.k === 'derive' && spellRule(R.d[0], R.d[2], R.d[1])) { R.stage = 'spell'; renderBld(); return; }
    renderBld(); bldFeedback(ok); return;
  }
  renderBld();
}
function bldUnpick(s) { var R = BLD.rounds[BLD.i]; if (R.stage !== 'build') return; R.sel.splice(s, 1); renderBld(); }
function bldSpell(i) { var R = BLD.rounds[BLD.i]; if (R.stage !== 'spell') return; var ok = R.spo[i] === R.d[1]; R.stage = 'done'; R.spellOk = ok; renderBldDone(); bldFeedback(ok); }
function renderBldDone() { var R = BLD.rounds[BLD.i]; R.stage = 'done'; }
function bldFam(i) { var R = BLD.rounds[BLD.i]; if (R.stage === 'done') return; R.picked[i] = !R.picked[i]; renderBld(); }
function bldFamOk() {
  var R = BLD.rounds[BLD.i]; if (R.stage === 'done') return;
  var ok = R.words.every(function (w, i) { return !!R.picked[i] === (R.fw.indexOf(w) >= 0); });
  R.stage = 'done';
  var btns = APP.querySelectorAll('.opt');
  for (var k = 0; k < btns.length; k++) { var inF = R.fw.indexOf(R.words[k]) >= 0; if (inF) btns[k].className += ' good'; else if (R.picked[k]) btns[k].className += ' bad'; }
  bldFeedback(ok);
}
function bldFeedback(ok) {
  var R = BLD.rounds[BLD.i], R2 = R, body = '', say = '';
  R.stage = 'done';
  recordAnswer(null, ok, 'builder');
  if (ok) { BLD.ok++; S.st.build = (S.st.build || 0) + 1; quest('build', 1); addXP(5); }
  if (R.k === 'derive') {
    var d = R.d, pre = d[2].charAt(d[2].length - 1) === '-', rule = spellRule(d[0], d[2], d[1]);
    body = (pre ? '<span class="pc pre sm">' + esc(d[2]) + '</span> + <span class="pc root sm">' + esc(d[0]) + '</span>' : '<span class="pc root sm">' + esc(d[0]) + '</span> + <span class="pc suf sm">' + esc(d[2]) + '</span>') + ' = <b>' + esc(d[1]) + '</b> (' + esc(d[3]) + ')' + (rule ? '<div class="tip" style="margin-top:8px">✏️ ' + rule + '</div>' : '');
    say = d[1];
  } else if (R.k === 'compound') {
    var c = R.c;
    body = '<span class="pc root sm">' + esc(c[0]) + '</span> + <span class="pc root sm">' + esc(c[1]) + '</span> = <b>' + esc(c[2]) + '</b> ' + c[4] + ' (' + esc(c[3]) + ')<div class="tip" style="margin-top:8px">💡 Le premier mot précise le second : un <i>' + esc(c[1]) + '</i> lié à <i>' + esc(c[0]) + '</i>.</div>';
    say = c[2];
  } else {
    body = '<b>' + esc(R.base) + '</b> → ' + R.fam[R.base].map(function (x) { return '<b>' + esc(x[1]) + '</b> (' + esc(x[3]) + ')'; }).join(', ');
    say = R.base + ', ' + R.fw.join(', ');
  }
  speak(say);
  var fb = document.createElement('div'); fb.className = 'fb ' + (ok ? 'ok' : 'ko');
  fb.innerHTML = '<div class="in"><h3>' + (ok ? 'Bien construit ! 🧱' : 'Voici la bonne construction') + '</h3><p>' + body + '</p><div class="row"><button class="btn" data-act="say" data-arg="' + esc(say) + '" aria-label="Réécouter">🔊</button><button class="btn ' + (ok ? 'mint' : 'pink') + ' wide" data-act="bldNext" id="nextbtn">Continuer</button></div></div>';
  APP.appendChild(fb); $('nextbtn').focus(); save();
}
function bldNext() {
  BLD.i++;
  if (BLD.i >= BLD.rounds.length) return gameResult('🧱', BLD.ok + '/' + BLD.rounds.length + ' mots construits', '<p>Préfixes, suffixes et mots composés : tu peux maintenant deviner des mots que tu n\'as jamais vus !</p>', 5, 5 + BLD.ok * 2, 'builder');
  bldPrep(); renderBld();
}

  },

  sort: startSort,
  srt: function (el) { srtAns(+el.getAttribute('data-arg')); },

  wkey: function (el) { wKey(el.getAttribute('data-arg')); },
  upgrade: startUpgrade,
  upgAns: function (el) { upgAns(+el.getAttribute('data-arg')); },

  ladder: startLadder,
  ladTap: function (el) { ladTap(+el.getAttribute('data-arg')); },
  ladNext: ladNext,
  lab: startLab,
  labAns: function (el) { labAns(+el.getAttribute('data-arg')); },
  labNext: labNext,
  train: startTrain,

  bsAim: function (el) { bsAim(+el.getAttribute('data-arg')); },
  bsAns: function (el) { bsAns(+el.getAttribute('data-arg')); },

  cwCell: function (el) { cwCell(el.getAttribute('data-arg')); },

  badge: function (el) {
    var b = null; BADGES.forEach(function (x) { if (x.id === el.getAttribute('data-arg')) b = x; });
    modal('<div style="text-align:center"><div class="bigem"' + (S.badges[b.id] ? '' : ' style="filter:grayscale(1);opacity:.4"') + '>' + b.i + '</div><h2>' + esc(b.n) + '</h2><p class="muted">' + esc(b.d) + '</p><p>' + (S.badges[b.id] ? '✅ Obtenu' : '🔒 Pas encore obtenu') + '</p><button class="btn blue wide" data-act="closeModal">OK</button></div>');

document.addEventListener('click', function (e) {
  var el = closest(e.target, '[data-act]');
  if (!el || el.disabled) return;
  var f = ACT[el.getAttribute('data-act')];
  if (f) f(el, e);
});
document.addEventListener('change', function (e) {
  var k = e.target.getAttribute && e.target.getAttribute('data-chg');
  if (k === 'voice') { S.set.voice = e.target.value; save(); speak('This is my voice.'); }
  if (k === 'rate') { S.set.rate = parseFloat(e.target.value); save(); speak('Hello!'); }
});
document.addEventListener('keydown', function (e) {
  if (e.target && e.target.tagName === 'INPUT') { if (e.key === 'Enter' && VIEW === 'onboarding') ACT.obGo(); return; }
  var k = e.key;
  if (VIEW === 'wordle') {
    if (k === 'Enter') wKey('enter'); else if (k === 'Backspace') wKey('back'); else if (/^[a-zA-Z]$/.test(k)) wKey(k.toLowerCase());
    return;
  }
  if (VIEW === 'cross') { if (k === 'Backspace') { e.preventDefault(); cwKey('back'); } else if (/^[a-zA-Z]$/.test(k)) cwKey(k.toLowerCase()); return; }
  if (VIEW === 'speed') { if (k === 'ArrowLeft') spdAns(0); if (k === 'ArrowRight') spdAns(1); return; }
  var nb = $('nextbtn');
  if (nb && (k === 'Enter' || k === ' ')) { e.preventDefault(); nb.click(); return; }
  if (/^[1-4]$/.test(k)) { var opts = APP.querySelectorAll('.opt'); var o = opts[+k - 1]; if (o) o.click(); }
});

window.WORDUP_V4_API = { go: go, play: function(id){ if(typeof ACT[id] === "function") ACT[id](); }, stop: stopTimers, info: function(){ return {view: VIEW, themes: THEMES.length, words: WORDS.length, places: PLACES.length, linked: Object.keys(PL).length, cw: CW && CW.ents && CW.ents.length}; } };
